<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>半休・半休以上かんたん計算</title>
<meta name="description" content="高円寺営業所専用：勤革時の半休・半休以上（部分有休）のスケジュール申請・補助項目申請を自動計算するツール" />
<meta name="theme-color" content="#2563a8" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="半休計算" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="app-header">
  <h1 id="header-title">半休・半休以上かんたん計算</h1>
  <button id="btn-open-settings" class="icon-button" type="button" aria-label="設定">⚙️</button>
  <button id="btn-back-to-main" class="icon-button" type="button" aria-label="戻る" hidden>← 戻る</button>
</header>

<main id="view-calc">

  <div id="settings-warning" class="notice notice-warning" hidden>
    <p>最初に曜日ごとの勤務予定を設定してください。</p>
    <button id="btn-goto-settings-from-warning" type="button" class="btn btn-primary">設定する</button>
  </div>

  <form id="calc-form" class="card">
    <div class="field">
      <label for="leave-date">有給を取る日</label>
      <input type="date" id="leave-date" name="leave-date" required />
    </div>

    <p id="weekday-info" class="weekday-info" aria-live="polite"></p>

    <div class="field">
      <label for="leave-start">有給開始</label>
      <input type="time" id="leave-start" name="leave-start" required />
    </div>

    <div class="field">
      <label for="leave-end">有給終了</label>
      <input type="time" id="leave-end" name="leave-end" required />
    </div>

    <button type="submit" class="btn btn-primary btn-block">計算する</button>
  </form>

  <section id="result-section" class="result-section" hidden aria-live="polite"></section>

</main>

<main id="view-settings" hidden>
  <p class="settings-intro">曜日ごとの通常勤務予定を登録してください。一度設定すれば、普段はこの画面を開く必要はありません。</p>

  <form id="settings-form">
    <div id="weekday-settings-list"></div>

    <div class="card copy-tools">
      <p class="copy-tools-title">一括コピー</p>
      <button type="button" id="btn-copy-mon-to-weekdays" class="btn btn-secondary btn-block">
        月曜日の内容を火〜金へコピー
      </button>

      <div class="copy-custom">
        <div class="field">
          <label for="copy-source">コピー元の曜日</label>
          <select id="copy-source"></select>
        </div>
        <p class="copy-targets-label">コピー先の曜日（複数選択可）</p>
        <div id="copy-targets" class="copy-targets"></div>
        <button type="button" id="btn-copy-custom" class="btn btn-secondary btn-block">選択した曜日へコピー</button>
      </div>
    </div>

    <div class="settings-actions">
      <button type="submit" class="btn btn-primary btn-block">保存して戻る</button>
    </div>
  </form>
</main>

<footer class="app-footer">
  <p>設定データはこの端末内だけに保存され、外部へは送信されません。</p>
</footer>

<script type="module" src="js/app.js"></script>
</body>
</html>
